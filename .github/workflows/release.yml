name: Release Build Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: 420vision-windows-x64.zip
            binary_src: src-tauri/target/x86_64-pc-windows-msvc/release/vision420.exe
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: 420vision-macos-arm64.tar.gz
            binary_src: src-tauri/target/aarch64-apple-darwin/release/vision420

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Download Pre-trained FaceMesh ONNX Model
        shell: bash
        run: |
          mkdir -p models
          if [ ! -f models/facemesh.onnx ]; then
            curl -L -o models/facemesh.onnx "https://raw.githubusercontent.com/iperov/DeepFaceLive/fc7b787bda2b8c186e142c52857458eea3a935ed/modelhub/onnx/FaceMesh/FaceMesh.onnx"
          fi

      - name: Run Test Suite
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.platform.target }}

      - name: Build Tauri Binary
        shell: bash
        run: |
          npm run tauri build -- --target ${{ matrix.platform.target }} --no-bundle

      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist-release
          cp ${{ matrix.platform.binary_src }} dist-release/420vision.exe
          mkdir -p dist-release/models
          cp models/facemesh.onnx dist-release/models/
          cd dist-release && 7z a ../${{ matrix.platform.artifact_name }} *

      - name: Package Artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist-release
          cp ${{ matrix.platform.binary_src }} dist-release/420vision
          chmod +x dist-release/420vision
          mkdir -p dist-release/models
          cp models/facemesh.onnx dist-release/models/
          tar -czf ${{ matrix.platform.artifact_name }} -C dist-release .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.platform.artifact_name }}
          generate_release_notes: true
