[package]
name = "vision420"
version = "0.1.0"
description = "420vision: Ultra-lightweight Menu Bar / System Tray assistant for dry eye sufferers"
authors = ["Ganendra Aditya <ganendraditya@gmail.com>"]
edition = "2021"

[lib]
name = "vision420_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"] }
ort = { version = "2.0.0-rc.9", features = ["download-binaries"] }
ndarray = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6.0"
tempfile = "3.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.10"
